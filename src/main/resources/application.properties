# ==========================================
# Nome da aplicação
# ==========================================
spring.application.name=mototrack

# ==========================================
# Banco de Dados - Azure SQL Server (ENV VARS)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.microsoft.sqlserver.jdbc.SQLServerDriver}

# ==========================================
# JPA e Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# ==========================================
# Cache
# ==========================================
spring.cache.type=simple

# ==========================================
# Swagger UI (OpenAPI)
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==========================================
# Configuração de rede para rodar no container
# ==========================================
server.address=0.0.0.0
server.port=80
